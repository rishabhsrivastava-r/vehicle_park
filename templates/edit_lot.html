{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
        <h2 class="mb-4 text-center">Edit Parking Lot</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Location Name</label>
                <input type="text" name="location_name" class="form-control" value="{{ lot.prime_location_name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control" value="{{ lot.address }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Pincode</label>
                <input type="text" name="pincode" class="form-control" value="{{ lot.pincode }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price Per Hour (₹)</label>
                <input type="number" step="0.01" name="price_per_hour" class="form-control" value="{{ lot.price_per_hour }}" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Maximum Spots</label>
                <input type="number" name="maximum_spots" class="form-control" value="{{ lot.maximum_spots }}" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Update Lot</button>
        </form>
    </div>
</div>
{% endblock %}
