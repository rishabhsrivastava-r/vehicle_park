{% extends "base.html" %}

{% block content %}
<style>
.hero-section {
    position: relative;
    color: #ffffff;
    padding: 5rem 2rem;
    text-align: center;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: 4px solid #845ec2;       /* 4px thick, solid, purple-blue border */
    border-radius: 24px;
    
  
}

/* Video background styling */
.hero-video-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.7) contrast(0.9) saturate(0.8);
    z-index: 0;
    pointer-events: none;
    user-select: none;
}

.hero-content {
    position: relative;
    z-index: 1;
}

/* Fade in animations for content */
.hero-section h1 {
    font-weight: 700;
    font-size: 3.5rem;
    margin-bottom: 0.5rem;
    opacity: 0;
    animation: fadeInUp 1s forwards ease-in-out;
}

.hero-section p.lead {
    font-size: 1.3rem;
    font-weight: 300;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeInUp 1s 0.3s forwards ease-in-out;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.row.animate-cards {
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeInUp 1s 0.6s forwards ease-in-out;
}

.card {
    background: rgb(255, 255, 255) !important;
    backdrop-filter: none;
    color: #333;
    border-radius: 12px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    width: 320px;
    padding: 2rem 1.5rem;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: default;
    backdrop-filter: saturate(180%) blur(15px);
}

.card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 25px 40px rgba(0,0,0,0.25);
}

.card-body {
    text-align: center;
}

.card-body i {
    font-size: 3.5rem;
    margin-bottom: 1.25rem;
    color: #764ba2;
    transition: color 0.3s ease;
}

.card:hover .card-body i {
    color: #667eea;
}

.card-body h4 {
    font-weight: 600;
    margin-bottom: 0.75rem;
}

.card-body p {
    font-size: 1rem;
    margin-bottom: 1.5rem;
    color: #555;
}

.btn-primary, .btn-outline-primary, .btn-success {
    border-radius: 25px;
    padding: 0.6rem 1.8rem;
    font-weight: 600;
    transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
}

.btn-primary:hover {
    background-color: #5a67d8;
    box-shadow: 0 8px 15px rgba(90,103,216,0.4);
}

.btn-outline-primary {
    color: #5a67d8;
    border: 2px solid #5a67d8;
}

.btn-outline-primary:hover {
    background-color: #764ba2;
    color: #fff;
    box-shadow: 0 8px 15px rgba(118,75,162,0.4);
}

.btn-success:hover {
    background-color: #2f855a;
    box-shadow: 0 8px 15px rgba(47,133,90,0.4);
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translate3d(0, 20px, 0);
    }
    to {
        opacity: 1;
        transform: none;
    }
}
</style>

<div class="hero-section">
    <!-- Background video -->
    <video autoplay muted loop playsinline preload ="auto" class="hero-video-bg" preload="auto">
        <source src="{{ url_for('static', filename='videos/car-drifting.mp4') }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="hero-content">
        <h1> <span class="text-border"> Welcome to Vehicle Parking App </span></h1>
        <p class="lead">Find and book parking spots easily in your area</p>

        <div class="row animate-cards mt-4">
            <div class="card">
                <div class="card-body">
                    <i class="fas fa-user"></i>
                    <h4>For Users</h4>
                    <p>Book parking spots, manage reservations</p>
                    <a href="{{ url_for('user.user_login') }}" class="btn btn-primary me-2">Login</a>
                    <br>
                    <br>
                    <a href="{{ url_for('user.user_register') }}" class="btn btn-outline-primary">Register</a>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <i class="fas fa-user-shield"></i>
                    <h4>For Admins</h4>
                    <p>Manage parking lots and monitor usage</p>
                    <a href="{{ url_for('admin.admin_login') }}" class="btn btn-success">Admin Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
